[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merkl-trader"
version = "0.1.0"
readme = "README.md"
description = "The reference Merkl trading agent: trades a treasury, pays its own compute bill, receipts every decision"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Merkl", email = "hello@merkl.ai" }]
keywords = ["ai", "agents", "xrpl", "trading", "merkl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    # merkl-sdk 0.3.1 carries the enrol answer's public urls and the managed
    # signer's secret hygiene (phase 20); 0.3.0 is what PyPI has today, so this
    # is pinned to what actually installs. Raise the floor to >=0.3.1 once that
    # release exists.
    "merkl-sdk[xrpl]>=0.3.0",
    "anthropic",
]

[project.urls]
Homepage = "https://merkl.ai"
Repository = "https://github.com/ramcav/merkl-trader"

[tool.hatch.build.targets.wheel]
packages = ["merkl_trader"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

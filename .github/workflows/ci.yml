# pytest + ruff on every push and pull request. No release step here — see
# release.yml for what a tag does.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: |
          ruff check merkl_trader tests
          ruff format --check merkl_trader tests

      - name: pytest
        run: pytest -q
